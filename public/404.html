<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>CENTRAL DE REMOÇÕES</title>
    <script>
      // Redireciona qualquer rota não encontrada de volta para a raiz do repositório no GitHub Pages
      var segments = window.location.pathname.split('/').filter(Boolean);
      var target = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(window.location.origin + target);
    </script>
  </head>
  <body>
  </body>
</html>
