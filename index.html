<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CENTRAL DE REMOÇÕES — Consulta e Gestão de Remoções Hospitalares</title>
    <meta name="description" content="Sistema Central de Remoções Hospitalares para consulta de planos de saúde, códigos TUSS, regras de autorização e ambulâncias." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Garante barra final no GitHub Pages para carregar os assets corretamente
      (function() {
        var p = window.location.pathname;
        if (window.location.hostname.indexOf('github.io') !== -1 && !p.endsWith('/') && !p.includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-600 selection:text-white font-sans min-h-screen">
    <div id="root">
      <div id="loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #1e293b; border-top-color: #0d9488; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: #fff;">CENTRAL DE REMOÇÕES</h2>
        <p style="font-size: 14px; color: #94a3b8; margin: 0; max-width: 400px;">Carregando dados hospitalares e convênios...</p>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('loading-fallback');
        if (el) {
          el.innerHTML = '<div style="background:#1e293b;border:1px solid #e11d48;padding:24px;border-radius:16px;max-width:550px;text-align:left;">' +
            '<h3 style="color:#f43f5e;margin:0 0 12px;font-size:18px;font-weight:700;">Falha ao Carregar Script</h3>' +
            '<p style="color:#cbd5e1;font-size:14px;margin:0 0 12px;line-height:1.5;">O navegador não conseguiu carregar os módulos da aplicação no GitHub Pages.</p>' +
            '<pre style="background:#020617;color:#fda4af;padding:12px;border-radius:8px;font-size:12px;overflow:auto;margin:0 0 16px;white-space:pre-wrap;">' + (e.message || 'Erro ao carregar script') + (e.filename ? ('\\nOrigem: ' + e.filename) : '') + '</pre>' +
            '<button onclick="location.reload()" style="background:#0d9488;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;margin-right:10px;">Recarregar</button>' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="background:#475569;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Limpar Dados e Recarregar</button>' +
            '</div>';
        }
      }, true);

      // Timeout safety check: se após 5 segundos o React não tiver montado, exibir diagnóstico
      setTimeout(function() {
        var fallback = document.getElementById('loading-fallback');
        if (fallback) {
          fallback.innerHTML = '<div style="background:#1e293b;border:1px solid #f59e0b;padding:24px;border-radius:16px;max-width:550px;text-align:left;">' +
            '<h3 style="color:#f59e0b;margin:0 0 12px;font-size:18px;font-weight:700;">Carregamento Demorando Mais que o Esperado</h3>' +
            '<p style="color:#cbd5e1;font-size:14px;margin:0 0 12px;line-height:1.5;">O script principal está demorando para iniciar ou não foi encontrado pelo navegador no caminho atual.</p>' +
            '<p style="color:#94a3b8;font-size:13px;margin:0 0 16px;">Abra o <strong>Console (F12)</strong> para ver a mensagem exata do navegador.</p>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
              '<button onclick="location.reload()" style="background:#0d9488;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Recarregar Página</button>' +
              '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="background:#475569;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Limpar Cache/Dados</button>' +
            '</div>' +
          '</div>';
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
