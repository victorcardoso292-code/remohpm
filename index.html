<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Remoções — Consulta e Gestão de Remoções Hospitalares</title>
    <meta name="description" content="Sistema de consulta e gestão inteligente de Remoções Hospitalares para convênios e planos de saúde." />
    <meta property="og:title" content="Central de Remoções — Consulta e Gestão de Remoções Hospitalares" />
    <meta property="og:description" content="Sistema de consulta e gestão inteligente de Remoções Hospitalares para convênios e planos de saúde." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Garante resolução de caminho base para qualquer subdiretório do GitHub Pages ou domínio raiz
      (function() {
        var p = window.location.pathname;
        var last = p.substring(p.lastIndexOf('/') + 1);
        var dir = (!last || last.indexOf('.') === -1)
          ? (p.endsWith('/') ? p : p + '/')
          : p.substring(0, p.lastIndexOf('/') + 1);

        if (!p.endsWith('/') && (!last || last.indexOf('.') === -1)) {
          try {
            history.replaceState(null, '', window.location.origin + dir + window.location.search + window.location.hash);
          } catch (e) {}
        }
        document.write('<base href="' + window.location.origin + dir + '">');
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-600 selection:text-white font-sans min-h-screen">
    <div id="root">
      <div id="loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #1e293b; border-top-color: #0d9488; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 8px 0; color: #fff;">CENTRAL DE REMOÇÕES</h2>
        <p style="font-size: 14px; color: #94a3b8; margin: 0; max-width: 400px;">Carregando dados hospitalares e convênios...</p>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script>
      // Captura erros reais de script, ignorando recursos de mídia como imagens ou fontes
      window.addEventListener('error', function(e) {
        if (e.target && e.target !== window && e.target.tagName !== 'SCRIPT') {
          return;
        }
        var el = document.getElementById('loading-fallback');
        if (el) {
          var targetSrc = (e.target && e.target.src) ? e.target.src : '';
          var segs = window.location.pathname.split('/').filter(Boolean);
          var homeUrl = window.location.origin + (segs.length > 0 ? '/' + segs[0] + '/' : '/');
          
          el.innerHTML = '<div style="background:#1e293b;border:1px solid #e11d48;padding:24px;border-radius:16px;max-width:550px;text-align:left;box-shadow:0 10px 25px rgba(0,0,0,0.5);">' +
            '<h3 style="color:#f43f5e;margin:0 0 12px;font-size:18px;font-weight:700;">Falha ao Carregar Módulo da Aplicação</h3>' +
            '<p style="color:#cbd5e1;font-size:14px;margin:0 0 12px;line-height:1.5;">O navegador não conseguiu carregar o script principal da aplicação no GitHub Pages.</p>' +
            (targetSrc ? ('<p style="color:#94a3b8;font-size:12px;margin:0 0 8px;word-break:break-all;"><strong>Origem solicitada:</strong> ' + targetSrc + '</p>') : '') +
            '<pre style="background:#020617;color:#fda4af;padding:12px;border-radius:8px;font-size:12px;overflow:auto;margin:0 0 16px;white-space:pre-wrap;">' + (e.message || 'Erro ao carregar script') + '</pre>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
              '<button onclick="location.reload()" style="background:#0d9488;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Recarregar</button>' +
              '<button onclick="location.href=\'' + homeUrl + '\'" style="background:#2563eb;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Abrir Página Inicial</button>' +
              '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="background:#475569;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Limpar Dados</button>' +
            '</div>' +
          '</div>';
        }
      }, true);

      // Timeout safety check: se após 15 segundos o React não tiver montado, exibir diagnóstico
      setTimeout(function() {
        var fallback = document.getElementById('loading-fallback');
        if (fallback) {
          fallback.innerHTML = '<div style="background:#1e293b;border:1px solid #f59e0b;padding:24px;border-radius:16px;max-width:550px;text-align:left;">' +
            '<h3 style="color:#f59e0b;margin:0 0 12px;font-size:18px;font-weight:700;">Carregamento Demorando Mais que o Esperado</h3>' +
            '<p style="color:#cbd5e1;font-size:14px;margin:0 0 12px;line-height:1.5;">O script principal está demorando para iniciar ou não foi encontrado pelo navegador no caminho atual.</p>' +
            '<p style="color:#94a3b8;font-size:13px;margin:0 0 16px;">Abra o <strong>Console (F12)</strong> para ver a mensagem exata do navegador.</p>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;">' +
              '<button onclick="location.reload()" style="background:#0d9488;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Recarregar Página</button>' +
              '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="background:#475569;color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;">Limpar Cache/Dados</button>' +
            '</div>' +
          '</div>';
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
